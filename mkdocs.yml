# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Freelens docs
site_url: https://github.com/freelensapp/freelens
repo_url: https://github.com/freelensapp/freelens
repo_name: freelensapp/freelens
theme:
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  name: material
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - content.code.copy
    - content.code.select
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
nav:
  - index.md
  - extensions Development:
#      - Getting Started:
#          - extensions/creating-an-extension.md
      - API:
          - LensRendererExtension Class:
              - Overview: extensions/main/lens-renderer-extension-class.md
              - App Preferences: extensions/main/app-preferences.md
              - Entity Settings: extensions/main/entity-settings.md
              - KubeObject Detail Items: extensions/main/kube-object-detail-items.md
          - Catalog API: extensions/main/catalog-api.md
          - K8s API: extensions/main/k8s-api.md
      - Extension reference:
          - Overview: extensions/reference/index.md
          - Getting started: extensions/reference/01-getting-started.md
          - Extension classes and lifecycle: extensions/reference/02-extension-classes.md
          - Renderer registrations: extensions/reference/03-renderer-registrations.md
          - Main registrations: extensions/reference/04-main-registrations.md
          - UI components: extensions/reference/05-ui-components.md
          - Kubernetes API: extensions/reference/06-kubernetes-api.md
          - Persistence and IPC: extensions/reference/07-persistence-and-ipc.md
          - Catalog, navigation, theme: extensions/reference/08-catalog-navigation-theme.md
          - Capabilities and limitations: extensions/reference/09-capabilities-and-limitations.md
plugins:
  - blog
  - search
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
